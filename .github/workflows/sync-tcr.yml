name: Sync published GHCR image to Tencent Cloud

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      image:
        type: string
        required: true
      digest:
        type: string
        required: true
    secrets:
      TCR_USERNAME:
        required: true
      TCR_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: Published main commit (full 40-character SHA)
        type: string
        required: true
      image:
        description: Image to retry without rebuilding
        type: choice
        options: [runtime, operations]
        required: true
      stage_only:
        description: Export verified OCI image for a temporary alternate transfer path
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Keep manual retries of older SHAs separate from the current release. The caller
# cancels superseded push workflows; identical image/SHA copies cancel duplicates.
concurrency:
  group: tcr-${{ github.ref }}-${{ inputs.image }}-${{ inputs.commit }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    steps:
      - name: Check out trusted sync scripts
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested main commit and image
        env:
          SYNC_COMMIT: ${{ inputs.commit }}
          SYNC_IMAGE: ${{ inputs.image }}
          SYNC_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$SYNC_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$SYNC_IMAGE" in runtime|operations) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -n "$SYNC_DIGEST" ]; then
            [[ "$SYNC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          git merge-base --is-ancestor "$SYNC_COMMIT" origin/main

      - name: Install registry copy tool
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir -p "$RUNNER_TEMP/vinci-registry-tools"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-arm64 \
            --output "$RUNNER_TEMP/vinci-registry-tools/regctl"
          printf '%s  %s\n' \
            9f349bab5c407ac04f3dabf99c7c7a6b0f9e9723c23f2775380e804d02c6dbb9 \
            "$RUNNER_TEMP/vinci-registry-tools/regctl" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/vinci-registry-tools/regctl"
          echo "$RUNNER_TEMP/vinci-registry-tools" >> "$GITHUB_PATH"

      - name: Verify chunked uploads and reconnects with an isolated local registry
        if: ${{ inputs.stage_only != true }}
        timeout-minutes: 3
        run: python3 tests/chunked-registry-upload.integration.py

      - name: Log in to GHCR for read-only access
        timeout-minutes: 2
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Cloud TCR
        if: ${{ inputs.stage_only != true }}
        timeout-minutes: 2
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Stage GHCR image locally, upload to TCR, and verify (60 minutes per attempt)
        if: ${{ inputs.stage_only != true }}
        # Allow all three hours plus retry backoff and process cleanup.
        timeout-minutes: 185
        env:
          SYNC_COMMIT: ${{ inputs.commit }}
          SYNC_IMAGE: ${{ inputs.image }}
          SYNC_DIGEST: ${{ inputs.digest }}
        run: bash scripts/sync-tcr-image.sh "$SYNC_COMMIT" "$SYNC_IMAGE" "$SYNC_DIGEST"

      - name: Export a verified image without registry credentials
        if: ${{ inputs.stage_only == true }}
        timeout-minutes: 10
        env:
          SYNC_COMMIT: ${{ inputs.commit }}
          SYNC_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          suffix=''
          if [ "$SYNC_IMAGE" = operations ]; then suffix='-ops'; fi
          source="ghcr.io/${GITHUB_REPOSITORY,,}${suffix}"
          mkdir -p "$RUNNER_TEMP/mirror-stage"
          skopeo inspect --raw "docker://${source}:${SYNC_COMMIT}" > "$RUNNER_TEMP/source.manifest"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/source.manifest" | cut -d ' ' -f 1)"
          skopeo copy --all --preserve-digests "docker://${source}@${digest}" "oci:$RUNNER_TEMP/mirror-stage/image:release"
          skopeo inspect --raw "oci:$RUNNER_TEMP/mirror-stage/image:release" > "$RUNNER_TEMP/cache.manifest"
          [ "sha256:$(sha256sum "$RUNNER_TEMP/cache.manifest" | cut -d ' ' -f 1)" = "$digest" ]
          printf '%s\n' "$digest" > "$RUNNER_TEMP/mirror-stage/source.digest"
          tar -C "$RUNNER_TEMP/mirror-stage" -cf "$RUNNER_TEMP/mirror-oci.tar" image source.digest
          printf 'Verified OCI export: %s\n' "$digest"

      - name: Keep temporary image export for one day
        if: ${{ inputs.stage_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ inputs.image }}-${{ inputs.commit }}
          path: ${{ runner.temp }}/mirror-oci.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
