name: Copy current Guangzhou images to Hong Kong
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: sdutvinci_web
            tag: 16fd1489608599fc0c0102188387ea639917a6df
          - repository: sdutvinci_web-ops
            tag: 16fd1489608599fc0c0102188387ea639917a6df
          - repository: caddy
            tag: 2.10-alpine
          - repository: postgres
            tag: 17-bookworm
    concurrency:
      group: hk-current-migration-${{ matrix.repository }}
      cancel-in-progress: true
    steps:
      - name: Install checksum-verified registry client
        run: |
          mkdir -p "$RUNNER_TEMP/vinci-tools"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 \
            --output "$RUNNER_TEMP/vinci-tools/regctl"
          printf '%s  %s\n' 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc "$RUNNER_TEMP/vinci-tools/regctl" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/vinci-tools/regctl"
          echo "$RUNNER_TEMP/vinci-tools" >> "$GITHUB_PATH"
      - name: Log in to Guangzhou
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Log in to Hong Kong
        uses: docker/login-action@v4
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Copy only the current tag and verify the full index
        timeout-minutes: 185
        env:
          MIRROR_REPOSITORY: ${{ matrix.repository }}
          MIRROR_TAG: ${{ matrix.tag }}
          GODEBUG: http2client=0
        run: |
          set -euo pipefail
          source="ccr.ccs.tencentyun.com/sdutvinci/${MIRROR_REPOSITORY}:${MIRROR_TAG}"
          target="hkccr.ccs.tencentyun.com/sdutvinci/${MIRROR_REPOSITORY}:${MIRROR_TAG}"
          digest="$(regctl image digest "$source")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Source: %s\nTarget: %s\nPinned digest: %s\n' "$source" "$target" "$digest"
          regctl registry set hkccr.ccs.tencentyun.com --skip-check --blob-max 8388608 --blob-chunk 8388608 --req-concurrent 2
          for attempt in 1 2 3; do
            started="$SECONDS"
            printf '[%s] Attempt %s/3, maximum 60 minutes\n' "$(date -u +%FT%TZ)" "$attempt"
            if timeout --signal=TERM --kill-after=10s 3600s regctl image copy --force-recursive --verbosity info "${source%:*}@${digest}" "$target"; then
              actual="$(regctl image digest "$target")"
              [ "$actual" = "$digest" ]
              printf 'MIGRATION VERIFIED: %s digest=%s elapsed=%ss\n' "$target" "$actual" "$((SECONDS-started))"
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$((attempt*30))"
          done
