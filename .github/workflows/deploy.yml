name: Verify, build, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify content-only and application changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mode=application
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            mode="$(./scripts/classify-deployment.sh "$BASE_SHA" "$GITHUB_SHA")"
          fi
          printf 'mode=%s\n' "$mode" | tee -a "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vinci_cms_test
          POSTGRES_USER: vinci_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinci_test -d vinci_cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://vinci_test:ci-test-password@127.0.0.1:5432/vinci_cms_test
      CMS_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate operations files
        run: |
          cp .env.example .env
          bash -n scripts/ops-common.sh scripts/classify-deployment.sh scripts/deploy.sh scripts/backup.sh scripts/restore.sh
          sh -n docker/entrypoint.sh docker/gateway-entrypoint.sh
          docker compose config --quiet

      - name: Prepare Nuxt generated types
        run: npx nuxt prepare

      - name: Run CMS tests against the isolated test database
        run: npm run test:cms

      - name: Run type checking
        run: npm run typecheck

      - name: Run production build
        run: npm run build

  build-runtime:
    needs: [classify, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize runtime image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            cn.vinci.deployment.mode=${{ needs.classify.outputs.mode }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  build-operations:
    if: needs.classify.outputs.mode == 'application'
    needs: [classify, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize operations image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-ops" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build operations image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: operations
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=operations
          cache-to: type=gha,mode=max,scope=operations

  deploy:
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.classify.result == 'success'
      && needs.build-runtime.result == 'success'
      && (needs.classify.outputs.mode == 'content' || needs.build-operations.result == 'success')
    needs: [classify, build-runtime, build-operations]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH host identity
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" = /* ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_deploy"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable commit image over SSH
        env:
          DEPLOY_MODE: ${{ needs.classify.outputs.mode }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf -v remote_command \
            'cd -- %q && DEPLOY_COMMIT=%q DEPLOY_MODE=%q APP_IMAGE=%q APP_OPS_IMAGE=%q APP_IMAGE_TAG=%q ./scripts/deploy.sh' \
            "$DEPLOY_PATH" "$GITHUB_SHA" "$DEPLOY_MODE" "$image_name" "${image_name}-ops" "$GITHUB_SHA"
          ssh \
            -i "$HOME/.ssh/id_deploy" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
