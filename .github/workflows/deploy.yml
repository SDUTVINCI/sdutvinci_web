name: Verify and build deployable images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vinci_cms_test
          POSTGRES_USER: vinci_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinci_test -d vinci_cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://vinci_test:ci-test-password@127.0.0.1:5432/vinci_cms_test
      CMS_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate operations files
        run: |
          cp .env.example .env
          bash -n vinci scripts/ops-common.sh scripts/classify-deployment.sh scripts/auto-deploy.sh scripts/install-auto-deploy.sh scripts/cleanup-deploy-cache.sh scripts/deploy.sh scripts/backup.sh scripts/backup-verify.sh scripts/backup-prune.sh scripts/restore.sh scripts/instance-export.sh scripts/instance-import.sh scripts/instance-prune.sh scripts/v2-phase11-manual-acceptance.sh scripts/test-cms.sh tests/backup-restore.integration.sh tests/deploy-cache-cleanup.integration.sh tests/v2-phase11-markdown-security.integration.sh tests/v2-phase11-operations.integration.sh tests/v2-phase11-systemd.integration.sh tests/v2-phase11.integration.sh tests/v2-phase11-full.integration.sh
          sh -n docker/entrypoint.sh docker/gateway-entrypoint.sh
          docker compose config --quiet
          docker compose -f compose.yaml -f tests/fixtures/v2-phase11-isolation.compose.yaml config --quiet
          ./tests/deploy-cache-cleanup.integration.sh
          ./tests/auto-deploy.integration.sh
          ./tests/install-auto-deploy.integration.sh

      - name: Prepare Nuxt generated types
        run: npx nuxt prepare

      - name: Prepare isolated historical content snapshot
        env:
          V2_CONTENT_SNAPSHOT_SOURCE: ${{ runner.temp }}/vinci-phase11-cms-snapshot-test/content
        run: |
          snapshot_root="$(dirname -- "$V2_CONTENT_SNAPSHOT_SOURCE")"
          test "$snapshot_root" = "${RUNNER_TEMP}/vinci-phase11-cms-snapshot-test"
          test ! -e "$snapshot_root"
          install -d -m 0700 "$snapshot_root"
          printf 'vinci-phase11-cms-snapshot-test\n' > "$snapshot_root/.vinci-test-owner"
          git cat-file -e '08a1c4908c8890dad5284e9682304e1ac0c7550e^{commit}'
          git archive 08a1c4908c8890dad5284e9682304e1ac0c7550e \
            content/news content/wiki content/members \
            | tar --extract --file=- --directory "$snapshot_root"
          test "$(find "$V2_CONTENT_SNAPSHOT_SOURCE" -type f -name '*.md' | wc -l)" -eq 260

      - name: Run CMS tests against the isolated test database
        env:
          V2_CONTENT_SNAPSHOT_SOURCE: ${{ runner.temp }}/vinci-phase11-cms-snapshot-test/content
        run: npm run test:cms

      - name: Clean isolated historical content snapshot
        if: always()
        env:
          V2_CONTENT_SNAPSHOT_SOURCE: ${{ runner.temp }}/vinci-phase11-cms-snapshot-test/content
        run: |
          snapshot_root="$(dirname -- "$V2_CONTENT_SNAPSHOT_SOURCE")"
          test "$snapshot_root" = "${RUNNER_TEMP}/vinci-phase11-cms-snapshot-test"
          if [ ! -e "$snapshot_root" ]; then exit 0; fi
          test -d "$snapshot_root" && test ! -L "$snapshot_root"
          test -f "$snapshot_root/.vinci-test-owner"
          test "$(cat "$snapshot_root/.vinci-test-owner")" = 'vinci-phase11-cms-snapshot-test'
          find "$snapshot_root" -xdev -depth -mindepth 1 -delete
          rmdir -- "$snapshot_root"

      - name: Run V2 phase 10 dependency and database-content checks
        run: npm run test:v2:phase10

      - name: Run V2 phase 11 unified operations and security checks
        run: npm run test:v2:phase11

      - name: Run type checking
        run: npm run typecheck

      - name: Run production build
        run: npm run build

  build-runtime:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize runtime image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            cn.vinci.deployment.mode=application
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  build-operations:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize operations image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-ops" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build operations image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: operations
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=operations
          cache-to: type=gha,mode=max,scope=operations
