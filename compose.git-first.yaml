# Short-term V2 phase 5 rollback overlay. The DB-first base Compose file does
# not require or mount GitHub write credentials.
services:
  app-blue:
    volumes:
      - type: bind
        source: ${CMS_GIT_SSH_KEY_FILE:?CMS_GIT_SSH_KEY_FILE is required for Git-first rollback}
        target: /run/secrets/cms_git_ssh_key
        read_only: true
      - type: bind
        source: ${CMS_GIT_KNOWN_HOSTS_FILE:?CMS_GIT_KNOWN_HOSTS_FILE is required for Git-first rollback}
        target: /run/secrets/cms_git_known_hosts
        read_only: true

  app-green:
    volumes:
      - type: bind
        source: ${CMS_GIT_SSH_KEY_FILE:?CMS_GIT_SSH_KEY_FILE is required for Git-first rollback}
        target: /run/secrets/cms_git_ssh_key
        read_only: true
      - type: bind
        source: ${CMS_GIT_KNOWN_HOSTS_FILE:?CMS_GIT_KNOWN_HOSTS_FILE is required for Git-first rollback}
        target: /run/secrets/cms_git_known_hosts
        read_only: true
