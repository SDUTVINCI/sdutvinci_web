name: ${COMPOSE_PROJECT_NAME:-vinci-cms}

x-app: &app
  image: ${APP_IMAGE:-sdutvinci-web}:${APP_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?NUXT_PUBLIC_SITE_URL is required}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    DATABASE_SSL: ${DATABASE_SSL:-false}
    CMS_AUTH_SECRET: ${CMS_AUTH_SECRET:?CMS_AUTH_SECRET is required}
    CMS_SESSION_COOKIE: ${CMS_SESSION_COOKIE:-vinci_cms_session}
    CMS_SESSION_TTL_HOURS: ${CMS_SESSION_TTL_HOURS:-168}
    CMS_SECURE_COOKIES: ${CMS_SECURE_COOKIES:-true}
    CMS_LOGIN_FAILURE_LIMIT: ${CMS_LOGIN_FAILURE_LIMIT:-5}
    CMS_LOGIN_FAILURE_WINDOW_MINUTES: ${CMS_LOGIN_FAILURE_WINDOW_MINUTES:-15}
    CMS_LOGIN_LOCKOUT_MINUTES: ${CMS_LOGIN_LOCKOUT_MINUTES:-15}
    CMS_LOGIN_IP_ATTEMPT_LIMIT: ${CMS_LOGIN_IP_ATTEMPT_LIMIT:-30}
    CMS_LOGIN_IP_WINDOW_MINUTES: ${CMS_LOGIN_IP_WINDOW_MINUTES:-5}
    CMS_MEDIA_UPLOAD_LIMIT: ${CMS_MEDIA_UPLOAD_LIMIT:-20}
    CMS_MEDIA_UPLOAD_WINDOW_MINUTES: ${CMS_MEDIA_UPLOAD_WINDOW_MINUTES:-1}
    CMS_CONTENT_ROOT: /app/content
    CMS_GIT_WORKTREE: /var/lib/vinci-cms/worktree
    # DB-first does not require Git credentials. The invalid default makes any
    # accidental legacy call fail closed; use compose.git-first.yaml for rollback.
    CMS_GIT_REMOTE_URL: ${CMS_GIT_REMOTE_URL:-ssh://git-disabled.invalid/no-access}
    CMS_GIT_REMOTE: ${CMS_GIT_REMOTE:-origin}
    CMS_GIT_BRANCH: ${CMS_GIT_BRANCH:-main}
    CMS_GIT_AUTHOR_NAME: ${CMS_GIT_AUTHOR_NAME:-Vinci CMS}
    CMS_GIT_AUTHOR_EMAIL: ${CMS_GIT_AUTHOR_EMAIL:-cms@localhost}
    CONTENT_PUBLISH_MODE: ${CONTENT_PUBLISH_MODE:-database}
    CONTENT_SOURCE_NEWS: ${CONTENT_SOURCE_NEWS:-database}
    CONTENT_SOURCE_WIKI: ${CONTENT_SOURCE_WIKI:-database}
    CONTENT_SOURCE_MEMBERS: ${CONTENT_SOURCE_MEMBERS:-legacy_git}
    CONTENT_CANDIDATE_ENV: ${CONTENT_CANDIDATE_ENV:-production}
    # Phase 8 imports selected PR diff items into drafts/proposals only.
    CONTENT_PR_IMPORT_MODE: ${CONTENT_PR_IMPORT_MODE:-disabled}
    CONTENT_PR_IMPORT_REPOSITORY_ID: ${CONTENT_PR_IMPORT_REPOSITORY_ID:-SDUTVINCI/sdutvinci_content}
    CONTENT_PR_IMPORT_API_URL: ${CONTENT_PR_IMPORT_API_URL:-https://api.github.com}
    CONTENT_PR_IMPORT_GITHUB_TOKEN: ${CONTENT_PR_IMPORT_GITHUB_TOKEN:-}
    CONTENT_PR_IMPORT_ROLE_CODES: ${CONTENT_PR_IMPORT_ROLE_CODES:-content_importer}
    CONTENT_PR_IMPORT_MAX_FILE_BYTES: ${CONTENT_PR_IMPORT_MAX_FILE_BYTES:-1048576}
    CONTENT_PR_IMPORT_MAX_FILES: ${CONTENT_PR_IMPORT_MAX_FILES:-200}
    CONTENT_PR_IMPORT_RETRY_ATTEMPTS: ${CONTENT_PR_IMPORT_RETRY_ATTEMPTS:-3}
    S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
    S3_REGION: ${S3_REGION:?S3_REGION is required}
    S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    S3_KEY_PREFIX: ${S3_KEY_PREFIX:-images}
    CMS_IMAGE_MAX_BYTES: ${CMS_IMAGE_MAX_BYTES:-10485760}
    CMS_IMAGE_MAX_WIDTH: ${CMS_IMAGE_MAX_WIDTH:-2560}
    CMS_IMAGE_MAX_HEIGHT: ${CMS_IMAGE_MAX_HEIGHT:-2560}
    CMS_IMAGE_WEBP_QUALITY: ${CMS_IMAGE_WEBP_QUALITY:-82}
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  volumes:
    - cms_git_worktree:/var/lib/vinci-cms/worktree
  networks:
    - frontend
    - backend

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  app-blue:
    <<: *app

  app-green:
    <<: *app

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app-blue:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/vinci-gateway-entrypoint.sh"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - gateway_config:/config
      - type: bind
        source: ./docker/gateway-entrypoint.sh
        target: /usr/local/bin/vinci-gateway-entrypoint.sh
        read_only: true
      - type: bind
        source: ./docker/Caddyfile.default
        target: /etc/caddy/Caddyfile.default
        read_only: true
    networks:
      - frontend

  migrate:
    image: ${APP_OPS_IMAGE:-sdutvinci-web-ops}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: operations
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    command: ["npm", "run", "db:migrate"]
    networks:
      - backend

  admin:
    image: ${APP_OPS_IMAGE:-sdutvinci-web-ops}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: operations
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      CMS_AUTH_SECRET: ${CMS_AUTH_SECRET:?CMS_AUTH_SECRET is required}
    command: ["npm", "run", "cms:admin"]
    networks:
      - backend

  content-export-worker:
    image: ${APP_OPS_IMAGE:-sdutvinci-web-ops}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: operations
    profiles: ["content-export"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      CMS_CONTENT_ROOT: /app/content
      CMS_GIT_WORKTREE: /var/lib/vinci-cms/worktree
      CONTENT_REPOSITORY_ID: ${CONTENT_REPOSITORY_ID:-SDUTVINCI/sdutvinci_content}
      CONTENT_EXPORT_MODE: ${CONTENT_EXPORT_MODE:-disabled}
      CONTENT_EXPORT_REMOTE_URL: ${CONTENT_EXPORT_REMOTE_URL:-git@github.com:SDUTVINCI/sdutvinci_content.git}
      CONTENT_EXPORT_REMOTE: ${CONTENT_EXPORT_REMOTE:-origin}
      CONTENT_EXPORT_BRANCH: ${CONTENT_EXPORT_BRANCH:-main}
      CONTENT_EXPORT_WORKSPACE: /var/lib/vinci-cms/content-export
      CONTENT_EXPORT_AUTHOR_NAME: ${CONTENT_EXPORT_AUTHOR_NAME:-Vinci Content Exporter}
      CONTENT_EXPORT_AUTHOR_EMAIL: ${CONTENT_EXPORT_AUTHOR_EMAIL:-content-export@localhost}
      CONTENT_EXPORT_SSH_KEY_FILE: /run/secrets/content_export_ssh_key
      CONTENT_EXPORT_KNOWN_HOSTS_FILE: /run/secrets/content_export_known_hosts
      CONTENT_EXPORT_BATCH_SIZE: ${CONTENT_EXPORT_BATCH_SIZE:-50}
      CONTENT_EXPORT_POLL_SECONDS: ${CONTENT_EXPORT_POLL_SECONDS:-60}
      CONTENT_EXPORT_LEASE_SECONDS: ${CONTENT_EXPORT_LEASE_SECONDS:-300}
      CONTENT_EXPORT_MAX_ATTEMPTS: ${CONTENT_EXPORT_MAX_ATTEMPTS:-5}
      CONTENT_EXPORT_RETRY_BASE_SECONDS: ${CONTENT_EXPORT_RETRY_BASE_SECONDS:-60}
      CONTENT_EXPORT_RETRY_MAX_SECONDS: ${CONTENT_EXPORT_RETRY_MAX_SECONDS:-3600}
    command: ["npm", "run", "v2:content:worker"]
    volumes:
      - content_export_worktree:/var/lib/vinci-cms/content-export
    networks:
      - backend

  content-reconcile:
    image: ${APP_OPS_IMAGE:-sdutvinci-web-ops}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: operations
    profiles: ["content-reconcile"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      CMS_CONTENT_ROOT: /app/content
      CMS_GIT_WORKTREE: /var/lib/vinci-cms/worktree
      CONTENT_REPOSITORY_ID: ${CONTENT_REPOSITORY_ID:-SDUTVINCI/sdutvinci_content}
      CONTENT_EXPORT_MODE: ${CONTENT_EXPORT_MODE:-disabled}
      CONTENT_EXPORT_REMOTE_URL: ${CONTENT_EXPORT_REMOTE_URL:-git@github.com:SDUTVINCI/sdutvinci_content.git}
      CONTENT_EXPORT_REMOTE: ${CONTENT_EXPORT_REMOTE:-origin}
      CONTENT_EXPORT_BRANCH: ${CONTENT_EXPORT_BRANCH:-main}
      CONTENT_EXPORT_WORKSPACE: /var/lib/vinci-cms/content-export
      CONTENT_EXPORT_AUTHOR_NAME: ${CONTENT_EXPORT_AUTHOR_NAME:-Vinci Content Exporter}
      CONTENT_EXPORT_AUTHOR_EMAIL: ${CONTENT_EXPORT_AUTHOR_EMAIL:-content-export@localhost}
      CONTENT_EXPORT_SSH_KEY_FILE: /run/secrets/content_export_ssh_key
      CONTENT_EXPORT_KNOWN_HOSTS_FILE: /run/secrets/content_export_known_hosts
      CONTENT_RECONCILIATION_ROOT: /var/lib/vinci-cms/content-reconciliation
      CONTENT_RECOVERY_MODE: disabled
    command: ["npm", "run", "v2:content:reconcile", "--", "--scheduled"]
    volumes:
      - content_export_worktree:/var/lib/vinci-cms/content-export
      - content_reconciliation_data:/var/lib/vinci-cms/content-reconciliation
    networks:
      - backend

  content-recovery:
    image: ${APP_OPS_IMAGE:-sdutvinci-web-ops}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: operations
    profiles: ["content-recovery"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      CMS_CONTENT_ROOT: /app/content
      CMS_GIT_WORKTREE: /var/lib/vinci-cms/worktree
      CONTENT_REPOSITORY_ID: ${CONTENT_REPOSITORY_ID:-SDUTVINCI/sdutvinci_content}
      CONTENT_EXPORT_MODE: disabled
      CONTENT_EXPORT_REMOTE_URL: ${CONTENT_EXPORT_REMOTE_URL:-git@github.com:SDUTVINCI/sdutvinci_content.git}
      CONTENT_EXPORT_REMOTE: ${CONTENT_EXPORT_REMOTE:-origin}
      CONTENT_EXPORT_BRANCH: ${CONTENT_EXPORT_BRANCH:-main}
      CONTENT_EXPORT_WORKSPACE: /var/lib/vinci-cms/content-export
      CONTENT_RECONCILIATION_ROOT: /var/lib/vinci-cms/content-reconciliation
      CONTENT_RECOVERY_MODE: enabled
    command: ["npm", "run", "v2:content:recover", "--"]
    volumes:
      - content_export_worktree:/var/lib/vinci-cms/content-export
      - content_reconciliation_data:/var/lib/vinci-cms/content-reconciliation
      - type: bind
        source: ${CONTENT_RECOVERY_SOURCE_ROOT:-/var/empty/vinci-content-recovery-disabled}
        target: /recovery-source
        read_only: true
    networks:
      - backend

volumes:
  postgres_data:
  cms_git_worktree:
  content_export_worktree:
  content_reconciliation_data:
  gateway_config:

networks:
  frontend:
  backend:
    internal: true
